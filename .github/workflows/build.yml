name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_fetch_delay
      - run: python -m pip install pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ClaudeUsageWidget
          --add-data "claude_usage_widget_fonts;claude_usage_widget_fonts"
          claude_usage_widget.py
      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsageWidget-windows
          path: dist/ClaudeUsageWidget.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ClaudeUsageWidget.exe
